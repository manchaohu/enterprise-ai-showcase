name: Publish AI reader site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo24/**'
      - 'demo25/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage reviewed pages only and check local links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from shutil import copy2
          pages = ['index.html', 'demo24/index.html', 'demo25/index.html']
          out = Path('_site')
          for name in pages:
              src=Path(name)
              assert src.is_file(), name
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              copy2(src,target)
          (out/'.nojekyll').touch()
          class LinkParser(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links += [v for k,v in attrs if k=='href' and v]
          for name in pages:
              parser=LinkParser()
              parser.feed((out/name).read_text(encoding='utf-8'))
              for link in parser.links:
                  if link.startswith(('https://','http://','mailto:','#')):continue
                  local=link.split('#')[0].split('?')[0]
                  assert (out/name).parent.joinpath(local).is_file(),(name,link)
          assert len(list(out.rglob('*.html')))==3
          print('Validated three publishable reader pages and relative links')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
