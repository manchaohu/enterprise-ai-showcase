name: Publish AI reader site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo*/**'
      - 'en/**'
      - 'coding-agent/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage whitelisted bilingual pages and verify local links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from shutil import copy2
          ids = [f'{number:02d}' for number in range(1, 28)]
          pages = ['index.html', 'en/index.html'] + [f'demo{number}/index.html' for number in ids] + [f'en/demo{number}/index.html' for number in ids] + ['coding-agent/ca01/index.html']
          assert len(pages) == 57
          out = Path('_site')
          for name in pages:
              src=Path(name)
              assert src.is_file(), name
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              copy2(src,target)
          (out/'.nojekyll').touch()
          class LinkParser(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links += [v for k,v in attrs if k=='href' and v]
          for name in pages:
              parser=LinkParser()
              parser.feed((out/name).read_text(encoding='utf-8'))
              for link in parser.links:
                  if link.startswith(('https://','http://','mailto:','#')):continue
                  local=link.split('#')[0].split('?')[0]
                  assert (out/name).parent.joinpath(local).is_file(),(name,link)
          assert len(list(out.rglob('*.html'))) == 57
          for number in ids:
              zh = (out/f'demo{number}/index.html').read_text(encoding='utf-8')
              en = (out/f'en/demo{number}/index.html').read_text(encoding='utf-8')
              assert f'../en/demo{number}/index.html' in zh, number
              assert f'../../demo{number}/index.html' in en, number
              assert '<html lang="zh-CN">' in zh, number
              assert '<html lang="en">' in en, number
          assert (out/'index.html').read_text(encoding='utf-8').count('class="card"') == 27
          assert (out/'en/index.html').read_text(encoding='utf-8').count('class="card"') == 27
          print('Validated 57 pages: 27 bilingual demos, two catalogs, one Coding Agent tutorial, and local links')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify public Pages URLs
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Check published Chinese and English pages over HTTPS
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          test -n "$base"
          paths=(index.html en/index.html coding-agent/ca01/index.html)
          for n in $(seq -w 1 27); do
            paths+=("demo${n}/index.html" "en/demo${n}/index.html")
          done
          for path in "${paths[@]}"; do
            file="$(mktemp)"
            curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 6 \
              -H 'Cache-Control: no-cache' "$base/$path?commit=$GITHUB_SHA" -o "$file"
            test -s "$file"
            grep -qi '<html' "$file"
            echo "LIVE_OK $base/$path bytes=$(wc -c < "$file")"
            rm -f "$file"
          done
